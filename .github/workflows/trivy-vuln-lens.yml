name: Trivy security scan

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      - name: Send SARIF to Vuln Lens
        if: always()
        env:
          INGEST_URL: https://vuln-lens-backend.onrender.com/api/vulnerabilities/ingest/github
        run: |
          set -euo pipefail
          test -s trivy-results.sarif
          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vuln-lens")"
          token="$(jq -er '.value' <<<"${response}")"
          jq -n --arg scanner_name "Trivy" --arg commit_sha "${GITHUB_SHA}" --slurpfile sarif trivy-results.sarif \
            '{scanner_name: $scanner_name, commit_sha: $commit_sha, scan_complete: true, raw_sarif_result: $sarif[0]}' > payload.json
          curl --fail-with-body -sS -X POST "${INGEST_URL}" -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" --data-binary @payload.json
